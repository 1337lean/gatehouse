version: 2
project_name: gatehouse
builds:
  - main: ./cmd/gatehouse
    binary: gatehouse
    env: [CGO_ENABLED=0]
    ldflags: -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
