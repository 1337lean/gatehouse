version: 2
project_name: gatehouse
builds:
  - main: ./cmd/gatehouse
    binary: gatehouse
    env: [CGO_ENABLED=0]
    ldflags: -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - docs/policy.md
      - testdata/demo-policy.json
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  disable: true
