name: Scheduled fuzzing

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - run: go test ./internal/policy -run='^$' -fuzz=FuzzLoad -fuzztime=10m
      - run: go test ./internal/verify -run='^$' -fuzz=FuzzChecksumManifest -fuzztime=10m
